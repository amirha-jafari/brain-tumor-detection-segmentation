# =========================================
# Brain Tumor Detection & Segmentation
# Central configuration file
# =========================================

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  image_size: 256         
  val_split: 0.15
  test_split: 0.15
  seed: 42

classification:
  backbone: "resnet18"     
  num_classes: 2           
  batch_size: 32
  learning_rate: 0.0001
  epochs: 20
  weights_path:  "models/classification/weights/classifier_weighted_best.pt"

segmentation:
  architecture: "unet"
  encoder: "resnet34"
  batch_size: 16
  learning_rate: 0.0001
  epochs: 40
  weights_path: "models/segmentation/weights/unet_best.pt"

training:
  device: "cuda"            
  num_workers: 2
  checkpoint_dir: "outputs/checkpoints"

inference:
  classification_threshold: 0.5  
